name: Validate with hassfest

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v5
      - name: Home Assistant Hassfest
        uses: home-assistant/actions/hassfest@master
